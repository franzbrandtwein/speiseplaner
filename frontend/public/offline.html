<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speisenplaner – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 360px;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #10B981;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      font-size: 2.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #064e3b;
      margin-bottom: 0.75rem;
    }
    p {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #10B981;
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #059669; }
    .cached-hint {
      margin-top: 2rem;
      padding: 1rem;
      background: white;
      border-radius: 0.75rem;
      border: 1px solid #d1fae5;
      font-size: 0.85rem;
      color: #059669;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🍽️</div>
    <h1>Du bist offline</h1>
    <p>
      Es konnte keine Verbindung zum Internet hergestellt werden.
      Bitte überprüfe deine Verbindung und versuche es erneut.
    </p>
    <button class="btn" onclick="window.location.reload()">Erneut versuchen</button>
    <div class="cached-hint">
      💡 Bereits geladene Seiten sind weiterhin verfügbar.
    </div>
  </div>
</body>
</html>
